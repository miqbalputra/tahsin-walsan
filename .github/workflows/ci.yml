name: CI

on:
  push:
    branches: [main, 'codex/**', 'feat/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP + Node test suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip, mbstring, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: PHP syntax check
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l

      - name: Rebuild and verify public assets
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --exit-code -- assets/css/app.css assets/js/alpine.min.js assets/js/chart.umd.min.js manifest.json sw.js

      # Fixture credentials must match tests/*: root/tahsin_local_test on 127.0.0.1:13317.
      # MariaDB is installed explicitly (not the preinstalled MySQL) because the suites
      # are validated against MariaDB.
      - name: Start MariaDB on 127.0.0.1:13317
        run: |
          sudo systemctl stop mysql 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mariadb-server
          printf '[mysqld]\nport=13317\nbind-address=127.0.0.1\n' | sudo tee /etc/mysql/mariadb.conf.d/99-ci-port.cnf >/dev/null
          # apt postinst already started the service on the default port;
          # restart so the port override above actually takes effect.
          sudo systemctl restart mariadb
          for i in $(seq 1 60); do
            if sudo mariadb -e 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          sudo mariadb -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'tahsin_local_test'; CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY 'tahsin_local_test'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION; FLUSH PRIVILEGES;"
          mariadb -h 127.0.0.1 -P 13317 -u root -ptahsin_local_test -e 'SELECT VERSION();'

      - name: PHPUnit unit tests
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit --configuration phpunit.xml

      - name: PHP integration suites
        run: |
          set -e
          php tests/run-tahsin-tests.php
          php tests/rapor-tests.php
          php tests/tahsin-reminder-tests.php
          php tests/api-rate-limit-tests.php
          php -d memory_limit=256M tests/attendance-history-integration.php
          php -d memory_limit=256M tests/attendance-form-integration.php
          php tests/security-integration.php
          php tests/backup-integration.php
          php -d memory_limit=256M tests/tahsin-mysql-integration.php
          php -d memory_limit=256M tests/autosave-integration.php
          php -d memory_limit=256M tests/participant-import-integration.php
          php -d memory_limit=256M tests/participant-management-integration.php
          php -d memory_limit=256M tests/membership-integration.php
          php -d memory_limit=256M tests/student-progress-integration.php
          php -d memory_limit=256M tests/achievement-integration.php
          php -d memory_limit=256M tests/participant-merge-integration.php
          php -d memory_limit=256M tests/family-integration.php
          php -d memory_limit=256M tests/data-induk-archive-integration.php

      - name: Asset, service worker, and workflow suites
        run: |
          set -e
          php tests/asset-tests.php
          node tests/autosave-storage-tests.cjs
          node tests/legacy-attendance-queue-tests.cjs
          node tests/service-worker-tests.cjs
          node tests/n8n-reminder-workflow.cjs

      - name: Security HTTP suite
        run: node tests/security-http-tests.cjs

      - name: Migration HTTP isolation suite
        run: node tests/migration-http-tests.cjs

      - name: Attendance recovery HTTP suite
        run: node tests/attendance-history-http-tests.cjs

      - name: Achievement HTTP suite
        run: node tests/achievement-http-tests.cjs

      - name: Legacy attendance HTTP suite
        run: node tests/legacy-attendance-http-tests.cjs

      - name: Membership HTTP suite
        run: node tests/membership-http-tests.cjs

      - name: Create weekly reminder HTTP fixture
        run: |
          set -e
          mariadb -h 127.0.0.1 -P 13317 -u root -ptahsin_local_test -e "DROP DATABASE IF EXISTS tahsin_test_weekly_reminder_ci"
          php tests/tahsin-reminder-mysql-integration.php tahsin_test_weekly_reminder_ci

      - name: Weekly reminder HTTP checks
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 13317
          DB_DATABASE: tahsin_test_weekly_reminder_ci
          DB_USERNAME: root
          DB_PASSWORD: tahsin_local_test
          N8N_API_KEY: tahsin-test-api
          HERMES_API_KEY: tahsin-test-api
        run: node tests/tahsin-reminder-http-runner.cjs
