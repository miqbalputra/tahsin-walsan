ServerName localhost

<Directory /var/www/html>
    AllowOverride All
    Options -Indexes
    Require all granted
</Directory>

# These paths are used by PHP through the filesystem, never by public HTTP.
<DirectoryMatch "^/var/www/html/(\.git|\.sessions|config|includes|templates|tests|scripts|docker|migrations|docs|temp_excel|backup|outputs|node_modules|vendor|next)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# PHP session files stay private even when SESSION_SAVE_PATH points into a
# different directory under the document root.
<FilesMatch "^sess_">
    Require all denied
</FilesMatch>

# JSON diblokir kecuali manifest.json (PWA); CSV diblokir kecuali template_*.csv.
<FilesMatch "(\.(sql|zip|xlsx|md)$|^(?!manifest\.json$)[^/]*\.json$|^(?!template_)[^/]*\.csv$)">
    Require all denied
</FilesMatch>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml
</IfModule>

<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/css "access plus 30 days"
    ExpiresByType application/javascript "access plus 30 days"
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType image/svg+xml "access plus 30 days"
    ExpiresByType application/manifest+json "access plus 1 day"
</IfModule>

<FilesMatch "\.(css|js|png|svg|webp|ico)$">
    Header set Cache-Control "public, max-age=2592000"
</FilesMatch>

<FilesMatch "\.(php)$">
    Header set Cache-Control "no-store, no-cache, must-revalidate"
</FilesMatch>

<Files "sw.js">
    Header set Cache-Control "no-store, no-cache, must-revalidate"
    ExpiresActive Off
</Files>
